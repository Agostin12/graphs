[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-cache-typing"
version = "0.1.0"
description = "Small examples for exploring generic container typing in Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Project contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
